name = "coveresy-ops"
main = "src/index.ts"
compatibility_date = "2025-01-15"

[vars]
# Non-secret config. Secrets (COVERESY_SESSION_SECRET, COVERESY_SETUP_TOKEN)
# are set with `wrangler secret put` and never live in this file.
COVERESY_ENV = "development"

# Production deploy: `wrangler deploy --env production`.
# The custom domain needs coveresy.com on Cloudflare DNS first — see
# DNS-MIGRATION.md. Until then, comment out [[env.production.routes]] and the
# Worker is reachable at its workers.dev URL.
# Mounted at coveresy.com/admin. BASE_PATH is what makes the app emit and accept
# that prefix; the routes below are what send those requests to this Worker.
# Everything else on the domain continues to the Vercel origin untouched.
[env.production]
vars = { COVERESY_ENV = "production", BASE_PATH = "/admin", ALLOWED_ORIGINS = "www.coveresy.com,coveresy.com" }

[[env.production.routes]]
pattern = "coveresy.com/admin*"
zone_name = "coveresy.com"

[[env.production.routes]]
pattern = "www.coveresy.com/admin*"
zone_name = "coveresy.com"

[[env.production.d1_databases]]
binding = "DB"
database_name = "coveresy-ops"
database_id = "5a6fbe35-e404-4dc0-bd2c-427d09c71af2"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "DOCS"
bucket_name = "coveresy-docs"

[[d1_databases]]
binding = "DB"
database_name = "coveresy-ops"
database_id = "5a6fbe35-e404-4dc0-bd2c-427d09c71af2"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "coveresy-docs"

# Served at the root of https://admin.coveresy.com through a Vercel rewrite, so
# no mount path: the portal owns that hostname outright. ALLOWED_ORIGINS lists
# the public hostnames the browser sees, because behind the proxy the Worker's
# own req.url carries the origin host instead.
[env.staging]
vars = { COVERESY_ENV = "production", ALLOWED_ORIGINS = "admin.coveresy.com,www.coveresy.com,coveresy.com" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "coveresy-ops"
database_id = "5a6fbe35-e404-4dc0-bd2c-427d09c71af2"
migrations_dir = "migrations"

# Policy documents partners attach to a missing-policy report. R2 is not yet
# enabled on this account, so the binding stays commented out; the report is
# still recorded without the file (see routes/partner-portal.ts). To turn it
# on: enable R2 in the dashboard, `wrangler r2 bucket create coveresy-docs`,
# then uncomment.
# [[env.staging.r2_buckets]]
# binding = "DOCS"
# bucket_name = "coveresy-docs"
