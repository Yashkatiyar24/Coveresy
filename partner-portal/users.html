<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Agents - Coveresy Partner</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link href="../assets/css.1d997c.css" rel="stylesheet">
<link href="portal.css" rel="stylesheet">
<style>
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
  dialog{border:none;border-radius:10px;padding:0;max-width:430px;width:92%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  dialog::backdrop{background:rgba(20,24,40,.5)}
  dialog .inner{padding:26px 28px}
  dialog h2{font:700 20px/1.2 'Lato',sans-serif;margin:0 0 18px}
  dialog{border-radius:14px}
</style>
</head>
<body>
<div class="shell">
  <div id="rail"></div>
  <main class="main">
  <div class="head">
    <div class="page-head" style="margin:0">
      <h1>My agents</h1>
      <p>People who sell under your code. Their quotes roll up to your dashboard.</p>
    </div>
    <button class="btn" id="add">Add an agent</button>
  </div>

  <div class="chips" id="tabs" style="margin:20px 0 16px">
    <button data-status="approved" class="on">Approved</button>
    <button data-status="pending">Pending</button>
    <button data-status="rejected">Rejected</button>
  </div>

  <div class="card" style="overflow:hidden">
    <table>
      <thead><tr><th>Agent code</th><th>Agent</th><th>Type</th><th>Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty hide" id="empty"><b>No agents yet</b>Add one and they can start raising quotes under your code.</div>
  </div>
  <p class="msg err hide" id="err"></p>
  </main>
</div>

<dialog id="dlg"><form class="inner" id="form" novalidate>
  <h2>Add an agent</h2>
  <label class="field"><span>Full name</span><input type="text" name="name" required></label>
  <label class="field"><span>Email</span><input type="email" name="email" required></label>
  <label class="field"><span>Mobile</span><input type="tel" name="mobile" maxlength="10" inputmode="numeric" required></label>
  <label class="field"><span>Temporary password</span><input type="password" name="password" minlength="8" required></label>
  <p class="msg err hide" id="derr"></p>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px">
    <button type="button" class="btn btn-ghost" id="cancel">Cancel</button>
    <button type="submit" class="btn">Create</button>
  </div>
</form></dialog>


<script src="app.js"></script>
<script>
let status = 'approved', agents = [];
const err = document.getElementById('err'), dlg = document.getElementById('dlg');

function render() {
  const rows = agents.filter((a) => a.status === status);
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  rows.forEach((a) => {
    const tr = document.createElement('tr');
    const code = document.createElement('td');
    code.className = 'mono'; code.textContent = a.agent_code; tr.appendChild(code);

    const who = document.createElement('td');
    who.innerHTML = '<div></div><div class="sub"></div>';
    who.children[0].textContent = a.name;
    who.children[1].textContent = `${a.email} · ${a.mobile}`;
    tr.appendChild(who);

    const type = document.createElement('td');
    const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = a.agent_type;
    type.appendChild(tag); tr.appendChild(type);

    const st = document.createElement('td');
    const stag = document.createElement('span');
    stag.className = 'tag' + (a.status === 'approved' ? ' done' : '');
    stag.textContent = a.status; st.appendChild(stag); tr.appendChild(st);
    tbody.appendChild(tr);
  });
  document.getElementById('empty').classList.toggle('hide', rows.length > 0);
  document.querySelectorAll('#tabs button').forEach((b) => {
    const n = agents.filter((a) => a.status === b.dataset.status).length;
    b.textContent = b.dataset.status.charAt(0).toUpperCase() + b.dataset.status.slice(1) + ` · ${n}`;
  });
}

async function load() {
  err.classList.add('hide');
  try { agents = (await api('/partner/agents')).accounts || []; render(); }
  catch (e) { err.textContent = e.message; err.classList.remove('hide'); }
}

(async () => {
  document.getElementById('rail').outerHTML = await (await fetch('_header.html')).text();
  await requirePartner('users');
  document.getElementById('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b));
    status = b.dataset.status; render();
  });
  document.getElementById('add').addEventListener('click', () => dlg.showModal());
  document.getElementById('cancel').addEventListener('click', () => dlg.close());
  const form = document.getElementById('form'), derr = document.getElementById('derr');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    derr.classList.add('hide');
    if (!/^[6-9][0-9]{9}$/.test(form.mobile.value.trim())) {
      derr.textContent = 'Please enter a valid 10-digit mobile number.'; derr.classList.remove('hide'); return;
    }
    try {
      await api('/partner/agents', { method: 'POST', body: JSON.stringify({
        name: form.name.value.trim(), email: form.email.value.trim(),
        mobile: form.mobile.value.trim(), password: form.password.value }) });
      dlg.close(); form.reset(); await load();
    } catch (e2) { derr.textContent = e2.message; derr.classList.remove('hide'); }
  });
  await load();
})();
</script>
</body>
</html>
