<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner Sign In - Coveresy</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link href="../assets/css.1d997c.css" rel="stylesheet">
<link href="portal.css" rel="stylesheet">
<style>
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;
    background:linear-gradient(225.39deg,rgb(60 40 110) 0,rgb(29 28 70) 100%)}
  .login-card{background:#fff;border-radius:10px;padding:34px 32px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .login-card img{width:160px;display:block;margin:0 auto 22px}
  .login-card h1{font-size:21px;text-align:center;margin-bottom:4px}
  .login-card p.sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 22px}
  .login-card .btn{width:100%;margin-top:6px}
  .foot{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="form" novalidate>
    <img src="../assets/logo_coveresy.e46b04b06dee.7a8794.svg" alt="Coveresy"
         style="filter:brightness(0) saturate(100%) invert(14%) sepia(37%) saturate(2000%) hue-rotate(228deg)">
    <h1>Partner sign in</h1>
    <p class="sub">Use the credentials issued by Coveresy.</p>
    <label class="field"><span>Email</span><input type="email" name="email" autocomplete="username" required></label>
    <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Sign in</button>
    <p class="msg err hide" id="err"></p>
    <p class="foot">Not a partner yet? <a href="/partner/">Apply here</a></p>
  </form>
</div>
<script src="app.js"></script>
<script>
  const form = document.getElementById('form');
  const err = document.getElementById('err');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.add('hide');
    const btn = form.querySelector('button');
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      await api('/partner/login', { method: 'POST', body: JSON.stringify({
        email: form.email.value.trim(), password: form.password.value }) });
      location.href = 'index.html';
    } catch (e2) {
      err.textContent = e2.message; err.classList.remove('hide');
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
