<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missing Policies - Coveresy Partner</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link href="../assets/css.1d997c.css" rel="stylesheet">
<link href="portal.css" rel="stylesheet">
<style>
  .layout{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px;align-items:start}
  @media(max-width:1020px){.layout{grid-template-columns:1fr}}
  .file{display:flex;align-items:center;gap:12px;border:1px dashed var(--line);border-radius:10px;padding:13px 15px;background:#fff}
  .file input{display:none}
  .file label{cursor:pointer;background:#f0edf9;color:var(--purple);border-radius:8px;padding:9px 14px;font:600 13.5px/1 'Lato',sans-serif}
  .file .nm{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="shell">
  <div id="rail"></div>
  <main class="main">
    <div class="page-head">
      <h1>Missing policies</h1>
      <p>Policy issued but not showing in your dashboard? Report it and we will trace it.</p>
    </div>

    <div class="layout">
      <form class="card pad" id="form" novalidate>
        <label class="field"><span>Policy number</span>
          <input type="text" name="policy_number" placeholder="As printed on the policy" required></label>
        <div class="row">
          <label class="field"><span>Issue month</span><input type="month" name="issue_month" required></label>
          <label class="field"><span>Product</span>
            <select name="product">
              <option value="car">Car</option><option value="bike">Bike</option>
              <option value="health">Health</option><option value="life">Life</option>
            </select></label>
        </div>
        <label class="field"><span>Policy start date</span><input type="date" name="start_date"></label>
        <label class="field"><span>Comment</span>
          <input type="text" name="comment" maxlength="500" placeholder="Anything that helps us find it"></label>
        <label class="field"><span>Policy document (optional, PDF or image, max 3 MB)</span></label>
        <div class="file">
          <input type="file" id="doc" accept=".pdf,.png,.jpg,.jpeg">
          <label for="doc">Choose file</label>
          <span class="nm" id="docname">No file chosen</span>
        </div>
        <div style="margin-top:20px"><button class="btn" type="submit">Submit report</button></div>
        <p class="msg err hide" id="err"></p>
        <p class="msg ok hide" id="ok"></p>
      </form>

      <div>
        <div class="chips" id="tabs" style="margin-bottom:16px">
          <button data-status="pending" class="on">Pending</button>
          <button data-status="in_review">In review</button>
          <button data-status="identified">Identified</button>
          <button data-status="rejected">Rejected</button>
        </div>
        <div class="card" style="overflow:hidden">
          <table>
            <thead><tr><th>Policy number</th><th>Month</th><th>Product</th><th>Reported</th><th>Outcome</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="empty hide" id="empty"><b>Nothing here</b>Reports you file appear in this log.</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="app.js"></script>
<script>
let status = 'pending', reports = [];
const err = document.getElementById('err'), ok = document.getElementById('ok');
const MAX_BYTES = 3 * 1024 * 1024;

function render() {
  const rows = reports.filter((r) => r.status === status);
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  rows.forEach((r) => {
    const tr = document.createElement('tr');
    const num = document.createElement('td');
    num.innerHTML = '<div class="mono"></div><div class="sub"></div>';
    num.children[0].textContent = r.policy_number;
    num.children[1].textContent = r.document_name || '';
    tr.appendChild(num);
    [r.issue_month, r.product, (r.created_at || '').slice(0, 10)].forEach((t) => {
      const td = document.createElement('td'); td.textContent = t || '—'; tr.appendChild(td);
    });
    const out = document.createElement('td');
    out.textContent = r.staff_note || (r.resolved_at ? 'Resolved ' + r.resolved_at.slice(0, 10) : '—');
    out.className = 'sub';
    tr.appendChild(out);
    tbody.appendChild(tr);
  });
  document.getElementById('empty').classList.toggle('hide', rows.length > 0);
  document.querySelectorAll('#tabs button').forEach((b) => {
    const n = reports.filter((r) => r.status === b.dataset.status).length;
    const name = b.dataset.status.replace('_', ' ');
    b.textContent = name.charAt(0).toUpperCase() + name.slice(1) + ` · ${n}`;
  });
}

async function load() {
  err.classList.add('hide');
  try { reports = (await api('/partner/missing-policies')).requests || []; render(); }
  catch (e) { err.textContent = e.message; err.classList.remove('hide'); }
}

const fileInput = document.getElementById('doc');
fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  document.getElementById('docname').textContent = f ? f.name : 'No file chosen';
});

function readFile(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = () => reject(new Error('Could not read that file.'));
    r.readAsDataURL(file);
  });
}

const form = document.getElementById('form');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.classList.add('hide'); ok.classList.add('hide');
  const body = {
    policy_number: form.policy_number.value.trim(),
    issue_month: form.issue_month.value,
    product: form.product.value,
    start_date: form.start_date.value || null,
    comment: form.comment.value.trim() || null,
  };
  if (body.policy_number.length < 3) return fail('Please enter the policy number.');
  if (!body.issue_month) return fail('Please pick the issue month.');

  const file = fileInput.files[0];
  if (file) {
    if (file.size > MAX_BYTES) return fail('That file is over 3 MB. Please attach a smaller copy.');
    body.document_name = file.name;
    body.document_type = file.type || 'application/octet-stream';
    try { body.document_base64 = await readFile(file); } catch (e2) { return fail(e2.message); }
  }

  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const res = await api('/partner/missing-policies', { method: 'POST', body: JSON.stringify(body) });
    ok.textContent = file && !res.document_stored
      ? 'Report filed. The document could not be stored, so our team may ask you for it.'
      : 'Report filed. You can track it in the log.';
    ok.classList.remove('hide');
    form.reset();
    document.getElementById('docname').textContent = 'No file chosen';
    status = 'pending';
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.status === 'pending'));
    await load();
  } catch (e2) { err.textContent = e2.message; err.classList.remove('hide'); }
  btn.disabled = false; btn.textContent = 'Submit report';
});

function fail(m) { err.textContent = m; err.classList.remove('hide'); }

(async () => {
  document.getElementById('rail').outerHTML = await (await fetch('_header.html')).text();
  await requirePartner('missing');
  document.getElementById('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b));
    status = b.dataset.status; render();
  });
  await load();
})();
</script>
</body>
</html>
