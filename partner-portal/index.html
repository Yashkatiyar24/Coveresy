<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Policy Dashboard - Coveresy Partner</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link href="../assets/css.1d997c.css" rel="stylesheet">
<link href="portal.css" rel="stylesheet">
</head>
<body>
<div id="hdr"></div>
<div class="wrap">
  <h1>Policy Dashboard</h1>

  <div class="tabs" id="products">
    <button data-product="car" class="on">Car</button>
    <button data-product="bike">Bike</button>
    <button data-product="health">Health</button>
    <button data-product="life">Life</button>
  </div>

  <div class="panel">
    <div style="flex:0 0 260px">
      <label class="field"><span>From date</span><input type="date" id="from"></label>
      <label class="field"><span>To date</span><input type="date" id="to"></label>
      <button class="btn" id="getdata">Get data</button>
    </div>
    <div class="kpis">
      <div class="kpi a"><b id="k-count">0</b><span>No of policies</span></div>
      <div class="kpi b"><b id="k-net">₹0</b><span>Net premium</span></div>
      <div class="kpi c"><b id="k-total">₹0</b><span>Total premium</span></div>
    </div>
  </div>

  <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px">
    <div class="tabs" id="stages" style="border:none;margin:0">
      <button data-stage="" class="on">All</button>
      <button data-stage="quote_created">Recent Quotes Created</button>
      <button data-stage="proposal_created">Proposal Created</button>
      <button data-stage="payment_pending">Payment Pending</button>
      <button data-stage="pending_inspection">Pending Inspections</button>
      <button data-stage="payment_done">Payment Done</button>
    </div>
    <div class="search">
      <input type="text" id="q" placeholder="Search for a name, registration number, phone no.">
      <button id="searchbtn" aria-label="Search">⌕</button>
    </div>
  </div>

  <div class="card" style="padding:0;overflow:hidden">
    <table>
      <thead><tr><th>Customer</th><th>Product</th><th>Details</th><th>Stage</th><th>Premium</th><th>Created</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty hide" id="empty"><b>Sorry!</b>No results found for this status.</div>
  </div>
  <p class="msg err hide" id="err"></p>
</div>

<script src="app.js"></script>
<script>
let product = 'car', stage = '', all = [];

const SUMMARY = {
  car: (d) => [d.registration, d.cover].filter(Boolean).join(' · '),
  bike: (d) => [d.registration, d.cover].filter(Boolean).join(' · '),
  health: (d) => [d.members && d.members + ' member(s)', d.sum_insured && '₹' + Number(d.sum_insured).toLocaleString('en-IN')].filter(Boolean).join(' · '),
  life: (d) => [d.plan, d.sum_assured && '₹' + Number(d.sum_assured).toLocaleString('en-IN'), d.term_years && d.term_years + ' yrs'].filter(Boolean).join(' · '),
};
const STAGE_LABEL = {
  quote_created: 'Quote created', proposal_created: 'Proposal created',
  payment_pending: 'Payment pending', pending_inspection: 'Pending inspection',
  payment_done: 'Payment done',
};

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const rows = all.filter((r) => {
    if (stage && r.stage !== stage) return false;
    if (!q) return true;
    return [r.customer_name, r.customer_phone, r.details].join(' ').toLowerCase().includes(q);
  });
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  rows.forEach((r) => {
    let d = {};
    try { d = JSON.parse(r.details || '{}'); } catch (e) {}
    const tr = document.createElement('tr');
    const cells = [
      r.customer_name || '—',
      r.product.charAt(0).toUpperCase() + r.product.slice(1),
      (SUMMARY[r.product] || (() => ''))(d) || '—',
      STAGE_LABEL[r.stage] || r.stage,
      r.total_premium ? money(r.total_premium) : '—',
      (r.created_at || '').slice(0, 10),
    ];
    cells.forEach((text, i) => {
      const td = document.createElement('td');
      if (i === 3) { const s = document.createElement('span'); s.className = 'pill'; s.textContent = text; td.appendChild(s); }
      else td.textContent = text;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  document.getElementById('empty').classList.toggle('hide', rows.length > 0);
}

async function load() {
  const err = document.getElementById('err');
  err.classList.add('hide');
  try {
    const data = await api('/partner/quotes?' + new URLSearchParams({
      product, date_from: document.getElementById('from').value, date_to: document.getElementById('to').value,
    }));
    all = data.quotes || [];
    const t = data.totals || {};
    document.getElementById('k-count').textContent = t.policies || 0;
    document.getElementById('k-net').textContent = money(t.net_premium);
    document.getElementById('k-total').textContent = money(t.total_premium);
    render();
  } catch (e) { err.textContent = e.message; err.classList.remove('hide'); }
}

function wireTabs(id, onPick) {
  document.getElementById(id).addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#' + id + ' button').forEach((x) => x.classList.toggle('on', x === b));
    onPick(b.dataset);
  });
}

(async () => {
  document.getElementById('hdr').innerHTML = await (await fetch('_header.html')).text();
  await requirePartner('dashboard');
  document.getElementById('from').value = monthStart();
  document.getElementById('to').value = today();
  wireTabs('products', (d) => { product = d.product; load(); });
  wireTabs('stages', (d) => { stage = d.stage || ''; render(); });
  document.getElementById('getdata').addEventListener('click', load);
  document.getElementById('q').addEventListener('input', render);
  await load();
})();
</script>
</body>
</html>
