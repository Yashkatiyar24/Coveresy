<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - Coveresy Partner</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link href="../assets/css.1d997c.css" rel="stylesheet">
<link href="portal.css" rel="stylesheet">
</head>
<body>
<div class="shell">
  <div id="rail"></div>
  <main class="main">
    <div class="page-head">
      <h1>Your business</h1>
      <p>Quote requests you and your agents have raised, and what they have converted to.</p>
    </div>

    <div class="seg" id="products">
      <button data-product="car" class="on">Car</button>
      <button data-product="bike">Bike</button>
      <button data-product="health">Health</button>
      <button data-product="life">Life</button>
    </div>

    <div class="card toolbar">
      <label class="field" style="max-width:190px"><span>From</span><input type="date" id="from"></label>
      <label class="field" style="max-width:190px"><span>To</span><input type="date" id="to"></label>
      <button class="btn btn-dark" id="getdata" style="margin-bottom:0">Apply</button>
      <div class="searchbox" style="margin-left:auto">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="text" id="q" placeholder="Search name, phone or registration">
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span>Issued policies</span><b class="mono" id="k-count">0</b></div>
      <div class="stat y"><span>Net premium</span><b class="mono" id="k-net">₹0</b></div>
      <div class="stat g"><span>Total premium</span><b class="mono" id="k-total">₹0</b></div>
      <div class="stat"><span>Open requests</span><b class="mono" id="k-open">0</b></div>
    </div>

    <div class="chips" id="stages" style="margin-bottom:16px">
      <button data-stage="" class="on">Everything</button>
      <button data-stage="quote_created">Quote raised</button>
      <button data-stage="proposal_created">Proposal made</button>
      <button data-stage="payment_pending">Awaiting payment</button>
      <button data-stage="pending_inspection">Inspection due</button>
      <button data-stage="payment_done">Issued</button>
    </div>

    <div class="card" style="overflow:hidden">
      <table>
        <thead><tr><th>Customer</th><th>Cover</th><th>Stage</th><th>Premium</th><th>Raised</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty hide" id="empty"><b>Nothing here yet</b>Raise a quote and it shows up on this list.</div>
    </div>
    <p class="msg err hide" id="err"></p>
  </main>
</div>

<script src="app.js"></script>
<script>
let product = 'car', stage = '', all = [];

const SUMMARY = {
  car: (d) => [d.registration, d.cover && d.cover.replace(/_/g, ' ')].filter(Boolean).join(' · '),
  bike: (d) => [d.registration, d.cover && d.cover.replace(/_/g, ' ')].filter(Boolean).join(' · '),
  health: (d) => [d.members && d.members + ' member(s)', d.sum_insured && '₹' + Number(d.sum_insured).toLocaleString('en-IN')].filter(Boolean).join(' · '),
  life: (d) => [d.plan, d.sum_assured && '₹' + Number(d.sum_assured).toLocaleString('en-IN'), d.term_years && d.term_years + ' yrs'].filter(Boolean).join(' · '),
};
const STAGE_LABEL = {
  quote_created: 'Quote raised', proposal_created: 'Proposal made',
  payment_pending: 'Awaiting payment', pending_inspection: 'Inspection due', payment_done: 'Issued',
};

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const rows = all.filter((r) => {
    if (stage && r.stage !== stage) return false;
    if (!q) return true;
    return [r.customer_name, r.customer_phone, r.details].join(' ').toLowerCase().includes(q);
  });
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  rows.forEach((r) => {
    let d = {};
    try { d = JSON.parse(r.details || '{}'); } catch (e) {}
    const tr = document.createElement('tr');

    const who = document.createElement('td');
    who.innerHTML = '<div></div><div class="sub"></div>';
    who.children[0].textContent = r.customer_name || 'Not named yet';
    who.children[1].textContent = r.customer_phone || '';
    tr.appendChild(who);

    const cover = document.createElement('td');
    cover.innerHTML = '<div></div><div class="sub"></div>';
    cover.children[0].textContent = r.product.charAt(0).toUpperCase() + r.product.slice(1);
    cover.children[1].textContent = (SUMMARY[r.product] || (() => ''))(d) || '—';
    tr.appendChild(cover);

    const st = document.createElement('td');
    const tag = document.createElement('span');
    tag.className = 'tag' + (r.stage === 'payment_done' ? ' done' : '');
    tag.textContent = STAGE_LABEL[r.stage] || r.stage;
    st.appendChild(tag);
    tr.appendChild(st);

    const prem = document.createElement('td');
    prem.className = 'mono';
    prem.textContent = r.total_premium ? money(r.total_premium) : '—';
    tr.appendChild(prem);

    const when = document.createElement('td');
    when.className = 'sub mono';
    when.textContent = (r.created_at || '').slice(0, 10);
    tr.appendChild(when);

    tbody.appendChild(tr);
  });
  document.getElementById('empty').classList.toggle('hide', rows.length > 0);
}

async function load() {
  const err = document.getElementById('err');
  err.classList.add('hide');
  try {
    const data = await api('/partner/quotes?' + new URLSearchParams({
      product, date_from: document.getElementById('from').value, date_to: document.getElementById('to').value,
    }));
    all = data.quotes || [];
    const t = data.totals || {};
    document.getElementById('k-count').textContent = t.policies || 0;
    document.getElementById('k-net').textContent = money(t.net_premium);
    document.getElementById('k-total').textContent = money(t.total_premium);
    document.getElementById('k-open').textContent = all.filter((r) => r.stage !== 'payment_done').length;
    render();
  } catch (e) { err.textContent = e.message; err.classList.remove('hide'); }
}

function wire(id, onPick) {
  document.getElementById(id).addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#' + id + ' button').forEach((x) => x.classList.toggle('on', x === b));
    onPick(b.dataset);
  });
}

(async () => {
  document.getElementById('rail').outerHTML = await (await fetch('_header.html')).text();
  await requirePartner('dashboard');
  document.getElementById('from').value = monthStart();
  document.getElementById('to').value = today();
  wire('products', (d) => { product = d.product; load(); });
  wire('stages', (d) => { stage = d.stage || ''; render(); });
  document.getElementById('getdata').addEventListener('click', load);
  document.getElementById('q').addEventListener('input', render);
  await load();
})();
</script>
</body>
</html>
